<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Form check</title>
</head>
<body>
<!-- Temporary: two minimal Netlify forms used to check form registration. Safe to delete. -->
<form name="ping" method="POST" data-netlify="true">
  <input type="hidden" name="form-name" value="ping">
  <input type="text" name="note">
</form>
<form name="ping-files" method="POST" data-netlify="true" enctype="multipart/form-data">
  <input type="hidden" name="form-name" value="ping-files">
  <input type="text" name="note">
  <input type="file" name="photo">
</form>
</body>
</html>
